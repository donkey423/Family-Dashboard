[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "family-finance-hub"
version = "0.1.0"
description = "家庭收支記錄 local-first household data platform"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.13,<2",
  "fastapi>=0.110,<1",
  "google-auth>=2.40,<3",
  "google-auth-oauthlib>=1.2,<2",
  "keyring>=25.7,<26",
  "openpyxl>=3.1.5,<4",
  "pypdf[crypto]>=6.19,<7",
  "python-multipart>=0.0.9,<1",
  "requests>=2.32,<3",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.29,<1",
]

[project.optional-dependencies]
ocr = ["pypdfium2>=5,<6"]
dev = ["httpx>=0.27,<1", "pytest>=8,<9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
